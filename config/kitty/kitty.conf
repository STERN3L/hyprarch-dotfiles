include ./macchiato.conf
font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_style        dotted
# url_color comes from the theme
#Close the terminal without confirmation
confirm_os_window_close 0
# Do not restore the last window's size/state (e.g. maximized): Hyprland handles tiling
remember_window_size no
background_opacity 0.95
