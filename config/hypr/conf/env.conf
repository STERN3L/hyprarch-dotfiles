# Environment variables (applied to applications started after logging in again)

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Native Wayland for Qt, falling back to X11 when needed
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Native Wayland for Electron (Discord, VS Code, Cursor, Obsidian, Spotify…) and Firefox
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# Java applications (JetBrains, GNS3…): avoids blank grey windows
env = _JAVA_AWT_WM_NONREPARENTING,1

# Cursor
env = XCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
