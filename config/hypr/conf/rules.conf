# Window and workspace rules — https://wiki.hyprland.org/Configuring/Window-Rules/

# Ignore maximize requests (kitty, Electron apps…): every new window takes its place in the tiling layout
windowrule = match:class .*, suppress_event maximize

# Windows opened from Waybar (nmtui, htop, yay): floating and centered
windowrule = match:class ^(waybar-float)$, float on, size 900 600, center on

# Small utilities float
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, float on, size 800 550, center on
windowrule = match:class ^(blueberry.py)$, float on, size 700 500, center on
windowrule = match:class ^(org.kde.filelight)$, float on, size 1000 700, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, float on, center on
# File dialogs (English and French titles)
windowrule = match:title ^(Open File|Save File|Save As|Ouvrir.*|Enregistrer.*)$, float on, center on

# Firefox picture-in-picture: floating and pinned on every workspace
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, size 640 360

# Applications assigned to a workspace (opened silently, without switching to it)
windowrule = match:class ^(discord)$, workspace 4 silent
windowrule = match:class ^([Ss]potify)$, workspace 5 silent

# Power menu (wlogout): blurred background
layerrule = match:namespace ^(logout_dialog)$, blur on
