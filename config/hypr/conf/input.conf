# Keyboard, mouse and touchpad — https://wiki.hyprland.org/Configuring/Variables/#input

input {
    # US QWERTY + French AZERTY, toggled with Alt+Shift (or by clicking the indicator in Waybar)
    kb_layout = us,fr
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 to 1.0, 0 means no modification

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
        drag_lock = false
        scroll_factor = 0.8
    }
}

# Three-finger horizontal swipe to switch workspaces
gesture = 3, horizontal, workspace
