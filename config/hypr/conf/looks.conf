# Look and feel — Catppuccin Macchiato palette (shared with Waybar, kitty, wofi, mako, hyprlock, wlogout)

general {
    gaps_in = 3
    gaps_out = 7
    border_size = 2
    col.active_border = rgba(c6a0f6ff) rgba(8aadf4ff) 45deg
    col.inactive_border = rgba(494d64ff)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 7
        passes = 2 # visually close to 3 passes, noticeably cheaper on battery
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1c2bcc)
    }
}

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, quick, fade
    animation = workspaces, 1, 5, overshot, slide
}

dwindle {
    pseudotile = true # Super+P
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    vfr = true # no frames are rendered while nothing changes (saves battery)
    focus_on_activate = true
}
