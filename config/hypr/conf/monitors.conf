# Monitors — https://wiki.hyprland.org/Configuring/Monitors/
monitor = , preferred, auto, 1.25

# Dual-monitor example (DP-1 on the left of the built-in panel):
# monitor = DP-1, 2560x1440@165, 0x0, 1
# monitor = eDP-1, preferred, 2560x0, 1.25

xwayland {
    # XWayland apps are rendered unscaled (sharp); their size is fixed with Xft.dpi (see autostart.conf)
    force_zero_scaling = true
}
