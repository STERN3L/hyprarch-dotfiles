# Autostart (exec-once runs once per session, not on every config reload)

exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = swaybg -m fill -i ~/.config/hypr/mr_robot_purple.jpg
exec-once = waybar -c ~/.config/waybar/Waybar-3.0/config -s ~/.config/waybar/Waybar-3.0/style.css
exec-once = hypridle

# Clipboard history (text and images)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# XWayland application size: 96 dpi × 1.25
exec-once = echo "Xft.dpi: 120" | xrdb -merge
