# Lock screen — https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# Catppuccin Macchiato palette

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/mr_robot_purple.jpg
    color = rgba(26, 28, 43, 1.0)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(202, 211, 245, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(198, 160, 246, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(138, 173, 244, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(198, 160, 246, 1.0) rgba(138, 173, 244, 1.0) 45deg
    inner_color = rgba(36, 39, 58, 0.9)
    font_color = rgba(202, 211, 245, 1.0)
    check_color = rgba(238, 212, 159, 1.0)
    fail_color = rgba(237, 135, 150, 1.0)
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    capslock_color = rgba(245, 169, 127, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    hide_input = false
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

# Battery and keyboard layout, at the bottom
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%   󰌌 $LAYOUT"
    color = rgba(166, 218, 149, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
