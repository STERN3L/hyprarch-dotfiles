# Idle management — https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
# Video playback and calls (browser, Discord…) inhibit idle while they are active.
# There is intentionally no automatic suspend.

general {
    lock_cmd = pidof hyprlock || hyprlock          # used by "loginctl lock-session"
    before_sleep_cmd = loginctl lock-session       # lock before sleeping (e.g. lid closed)
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 4 min 30 s: dim the screen as a warning
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: turn the screen off
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
